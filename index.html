<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Finite is an adaptive planning system for plans that must survive change. Codex operates through WebMCP; you choose and approve the result." />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="canonical" href="https://finite-plan-kitchen.bharthamk.chatgpt.site/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Finite" />
    <meta property="og:title" content="Finite — plans that survive contact with reality" />
    <meta property="og:description" content="Reality changed. What should the plan become now? Codex operates the live plan; you choose and approve what it becomes." />
    <meta property="og:url" content="https://finite-plan-kitchen.bharthamk.chatgpt.site/" />
    <meta property="og:image" content="https://finite-plan-kitchen.bharthamk.chatgpt.site/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Finite adaptive Paris plan with a human approval boundary" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Finite — plans that survive contact with reality" />
    <meta name="twitter:description" content="Reality changed. What should the plan become now?" />
    <meta name="twitter:image" content="https://finite-plan-kitchen.bharthamk.chatgpt.site/og.png" />
    <meta name="theme-color" content="#f4f0e8" />
    <meta name="finite-build" content="returned-draft-v44" />
    <title>Finite — adaptive plans, served</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app" aria-busy="true"></div>
    <div id="announcer" class="sr-only" aria-live="polite"></div>
    <noscript>Finite needs JavaScript to calculate and validate the live plan.</noscript>
    <script>
      if (document.modelContext) {
        window.finiteWebMCPReadiness = { state: "initializing" };
        document.modelContext.registerTool({
          name: "finite_webmcp_status",
          title: "Check whether the Finite kitchen is ready",
          description: "A minimal page-start bootstrap tool that exposes no plan state, credentials, or human authority.",
          inputSchema: { type: "object", properties: {}, required: [], additionalProperties: false },
          annotations: { readOnlyHint: true },
          execute: async () => {
            const readiness = window.finiteWebMCPReadiness || { state: "initializing" };
            if (readiness.state === "ready") return { ok: true, code: "WEBMCP_READY", inventory: readiness.inventory || [], acceptedStateChanged: false, next: "Call finite_enter_kitchen from this bootstrap snapshot or refresh discovery for the full catalogue." };
            if (readiness.state === "signed_out") return { ok: false, code: "AUTHENTICATED_USER_REQUIRED", acceptedStateChanged: false, next: "Complete the Site's official sign-in boundary; do not request or transmit credentials through WebMCP." };
            if (readiness.state === "failed") return { ok: false, code: "WEBMCP_INITIALIZATION_FAILED", detail: readiness.detail || "Finite did not finish initializing.", acceptedStateChanged: false, next: "Reload the Site. Do not infer plan state from a partial registry." };
            return { ok: true, code: "WEBMCP_INITIALIZING", retryAfterMs: 100, acceptedStateChanged: false, next: "Call the already-visible finite_enter_kitchen tool; it will wait for canonical state. Do not infer that the kitchen has no tools." };
          },
        });
        document.modelContext.registerTool({
          name: "finite_enter_kitchen",
          title: "Enter Finite as the operator",
          description: "A page-start proxy for the canonical Finite kitchen entry. It waits for authenticated state and then returns the same instrumented operator packet as the full registry tool.",
          inputSchema: {
            type: "object",
            properties: {
              entryIntent: { type: "string", enum: ["start_new", "continue_current", "resume_handoff"] },
              orderId: { type: "string", minLength: 1, maxLength: 200 },
              expectedOrderVersion: { type: "integer", minimum: 1 },
              expectedOrderChecksum: { type: "string", minLength: 64, maxLength: 64 },
              expectedPlanId: { type: "string", minLength: 1, maxLength: 200 },
              expectedPlanRevision: { type: "integer", minimum: 1 },
            },
            required: [],
            additionalProperties: false,
          },
          annotations: { readOnlyHint: true },
          execute: async (input = {}) => {
            const deadline = Date.now() + 15000;
            while (Date.now() < deadline) {
              const readiness = window.finiteWebMCPReadiness || { state: "initializing" };
              if (readiness.state === "signed_out") return { ok: false, code: "AUTHENTICATED_USER_REQUIRED", acceptedStateChanged: false, next: "Complete the Site's official sign-in boundary; do not request or transmit credentials through WebMCP." };
              if (readiness.state === "failed") return { ok: false, code: "WEBMCP_INITIALIZATION_FAILED", detail: readiness.detail || "Finite did not finish initializing.", acceptedStateChanged: false, next: "Reload the Site. Do not infer plan state from a partial registry." };
              if (typeof window.finiteEnterKitchen === "function") return window.finiteEnterKitchen(input);
              await new Promise((resolve) => setTimeout(resolve, 50));
            }
            return { ok: false, code: "WEBMCP_INITIALIZATION_TIMEOUT", acceptedStateChanged: false, next: "Reload the Site and retry finite_enter_kitchen. Do not reconstruct plan state from the copied handoff." };
          },
        });
      }
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
